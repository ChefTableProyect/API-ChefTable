spring.application.name=spring_proyecto
# MySQL. Los valores sensibles se proporcionan mediante variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spring?serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.jakarta.persistence.lock.timeout=${DB_LOCK_TIMEOUT_MS:5000}

# Pool acotado: evita que una ráfaga de tráfico agote la base de datos.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:1000}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

security.jwt.secret=${JWT_SECRET}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:1800}
security.password.bcrypt-strength=${BCRYPT_STRENGTH:12}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.tomcat.threads.max=${HTTP_MAX_THREADS:100}
server.tomcat.accept-count=${HTTP_ACCEPT_COUNT:100}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
